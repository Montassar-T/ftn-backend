version: "3.8"

services:
  db:
    image: postgres:15
    container_name: car-services-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: car_services
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: car-services-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build: .
    container_name: car-services-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      - db
    networks:
      - app-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app-network: