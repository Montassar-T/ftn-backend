version: "3.8"

services:
  db:
    image: postgres:15
    container_name: car-services-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: car_services
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: car-services-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: